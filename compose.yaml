name: gifjam

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gifjam}
      POSTGRES_USER: ${POSTGRES_USER:-gifjam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gifjam} -d ${POSTGRES_DB:-gifjam}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - internal

  api:
    build:
      context: ./backend
      dockerfile: src/GifJam.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-gifjam};Username=${POSTGRES_USER:-gifjam};Password=${POSTGRES_PASSWORD}
      Database__MigrateOnStartup: "true"
      DataProtection__KeysPath: /home/app/.aspnet/DataProtection-Keys
      ApplicationUrls__FrontendUrl: ${FRONTEND_URL:-http://localhost:4200}
      Discord__ClientId: ${DISCORD_CLIENT_ID}
      Discord__ClientSecret: ${DISCORD_CLIENT_SECRET}
      Discord__CallbackUrl: ${DISCORD_CALLBACK_URL:-http://localhost:5042/api/auth/discord/callback}
      Discord__BotEnabled: ${DISCORD_BOT_ENABLED:-false}
      Discord__BotToken: ${DISCORD_BOT_TOKEN:-}
      Discord__DevelopmentGuildId: ${DISCORD_DEVELOPMENT_GUILD_ID:-}
      Discord__BotActivity: ${DISCORD_BOT_ACTIVITY:-GifJam}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-GifJam.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-GifJam.Web}
      Jwt__LifetimeHours: ${JWT_LIFETIME_HOURS:-8}
      Klipy__ApiKey: ${KLIPY_API_KEY}
      Giphy__ApiKey: ${GIPHY_API_KEY}
      Gemini__ApiKey: ${GEMINI_API_KEY:-}
      Gemini__Model: ${GEMINI_MODEL:-gemini-3.5-flash}
    volumes:
      - api_data_protection:/home/app/.aspnet/DataProtection-Keys
    expose:
      - "8080"
    ports:
      - "127.0.0.1:${API_HOST_PORT:-5042}:8080"
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_HOST_PORT:-4200}:80"
    networks:
      - internal
      - dokploy-network

volumes:
  postgres_data:
  api_data_protection:

networks:
  internal:
    driver: bridge
  dokploy-network:
    external: true

