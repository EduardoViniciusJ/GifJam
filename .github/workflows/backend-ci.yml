name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.302
      - run: dotnet restore GifJam.sln
      - run: dotnet tool restore
      - run: dotnet format GifJam.sln --verify-no-changes --no-restore
      - run: dotnet build GifJam.sln -c Release --no-restore
      - run: dotnet test GifJam.sln -c Release --no-build --logger "console;verbosity=minimal"
      - run: dotnet list GifJam.sln package --vulnerable --include-transitive
      - name: Validate Azure Bicep templates
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/Azure/bicep/releases/download/v0.45.15/bicep-linux-x64 \
            --output "$RUNNER_TEMP/bicep"
          echo "ff5b194b042c220df4a50d6768ed1d6c39a32894bfdc4ff83d62b115d966a7ce  $RUNNER_TEMP/bicep" | sha256sum --check
          chmod +x "$RUNNER_TEMP/bicep"
          "$RUNNER_TEMP/bicep" build deploy/registry.bicep --stdout > /dev/null
          "$RUNNER_TEMP/bicep" build deploy/main.bicep --stdout > /dev/null
      - shell: pwsh
        run: ./scripts/Export-OpenApi.ps1
      - run: git diff --exit-code -- openapi/openapi.json
      - run: docker build -f src/GifJam.Api/Dockerfile -t gifjam-api:ci .
